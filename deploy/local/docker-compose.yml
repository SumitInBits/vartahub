services:

  keycloak:
    container_name: keycloak_app
    image: quay.io/keycloak/keycloak:26.7.2
    restart: always
    ports:
      - "8090:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST}:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - keycloak-db
    networks:
      - vartahub-network
    command:
      - start-dev

  iam-db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iam
    networks:
      - vartahub-network
    volumes:
      - iam-db-data:/var/lib/postgresql
    restart: unless-stopped

  keycloak-db:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    networks:
      - vartahub-network
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    restart: unless-stopped


networks:
  vartahub-network:
    driver: bridge

volumes:
  iam-db-data:
  keycloak-db-data: