spring:
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/vartahub

  datasource:
    username: vartahub
    password: vartahub


eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    prefer-ip-address: true


services:
  iam-service: vartahub-iam-service
  meeting-service: vartahub-meeting-service
  notification-service: vartahub-notification-service